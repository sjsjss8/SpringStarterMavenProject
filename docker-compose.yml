# ============================================================
# docker-compose.yml — 로컬 Docker 개발 환경
# ============================================================
# 역할:
#   Spring Boot 앱 + MariaDB를 로컬에서 컨테이너로 한 번에 실행한다.
#   "컨테이너화된 실제 서버와 유사한 환경"에서 개발/테스트할 때 사용.
#
# docker-compose.prod.yml과의 차이:
#   - build: . 있음 → 로컬 Dockerfile로 이미지를 직접 빌드
#   - SPRING_PROFILES_ACTIVE=dev (로컬 Docker는 dev 프로파일 사용)
#   - 이 파일은 로컬용, prod.yml은 원격 운영 서버용
#
# 사전 조건:
#   1. 프로젝트 루트에 .env 파일 생성: cp .env.example .env (후 값 수정)
#   2. Docker Desktop이 실행 중이어야 함
#
# 주요 명령어:
#   docker-compose up -d           백그라운드 실행 (이미지 없으면 자동 빌드)
#   docker-compose up -d --build   소스 변경 후 이미지 재빌드 + 실행
#   docker-compose down            컨테이너 종료 (볼륨/데이터 유지)
#   docker-compose down -v         컨테이너 + DB 데이터까지 완전 삭제
#   docker-compose logs -f app     앱 로그 실시간 확인
#   docker-compose ps              컨테이너 실행 상태 확인
# ============================================================

services:

  # ── Spring Boot 앱 ──────────────────────────────────────────────────────────
  app:
    build: .  # 이 디렉터리의 Dockerfile로 이미지를 직접 빌드 (레지스트리 없이 로컬 개발 가능)
    image: sangjinyoo/spring-starter-maven:${TAG:-latest}  # 빌드된 이미지에 붙일 이름과 태그
    # build와 image를 함께 쓰면: Dockerfile로 빌드하고 image 이름으로 태깅
    # → "docker-compose push"로 Docker Hub에 올릴 때 이 이름으로 올라감

    container_name: spring-app  # 컨테이너 이름 지정. 없으면 자동 생성됨(예: project_app_1)
                                 # docker exec spring-app bash 처럼 이름으로 직접 접근 가능

    ports:
      - "8081:8081"  # "호스트포트:컨테이너포트" 매핑
                     # 호스트(내 PC)의 8081 → 컨테이너 내부의 8081 으로 연결
                     # → 브라우저에서 localhost:8081 접속 가능

    environment:
      # 환경변수로 Spring Boot 설정 주입. application.yml의 ${환경변수명} 자리에 들어감.
      SPRING_PROFILES_ACTIVE: dev  # dev 프로파일 활성화 → application-dev.yml 설정 적용
      DB_HOST: mariadb             # 아래 'mariadb' 서비스 이름. Docker 네트워크 내 자동 DNS 해석됨
                                   # (같은 docker-compose 내 서비스끼리는 서비스명으로 통신 가능)
      DB_PORT: 3306
      DB_NAME:     ${DB_NAME:-SJSJSS}  # .env 파일에서 읽어옴. 없으면 기본값 SJSJSS
      DB_USERNAME: ${DB_USERNAME}      # .env 파일에서 읽어옴 (없으면 실행 실패)
      DB_PASSWORD: ${DB_PASSWORD}      # .env 파일에서 읽어옴
      JAVA_OPTS: "-Xms256m -Xmx512m"   # JVM 힙 메모리 설정: 최소 256MB 확보, 최대 512MB 제한

    depends_on:
      mariadb:
        condition: service_healthy  # mariadb 헬스체크 통과 후에만 앱 컨테이너 시작
                                    # DB 준비 전에 앱이 시작되면 "DB 연결 실패" 오류 발생

    restart: unless-stopped  # 비정상 종료 시 자동 재시작. "docker stop"으로 수동 종료한 경우는 재시작 안 함

    networks:
      - app-network  # 아래 정의된 네트워크에 연결 (mariadb와 같은 네트워크 → 서로 통신 가능)


  # ── MariaDB ─────────────────────────────────────────────────────────────────
  mariadb:
    image: mariadb:10.11   # MariaDB 10.11 LTS 버전 (2028년까지 장기 지원)
                           # 태그를 명시하지 않으면 'latest'가 되어 예상치 못한 버전 업그레이드 발생 가능

    container_name: mariadb

    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}  # root 계정 비밀번호. 앱 접속 계정과 별도로 관리
      MARIADB_DATABASE:      ${DB_NAME:-SJSJSS}   # 컨테이너 최초 실행 시 이 이름으로 DB 자동 생성
      MARIADB_USER:          ${DB_USERNAME}        # 앱이 사용할 일반 계정 (root보다 권한 제한)
      MARIADB_PASSWORD:      ${DB_PASSWORD}        # 위 계정의 비밀번호

    volumes:
      - mariadb-data:/var/lib/mysql  # DB 데이터를 Named Volume에 영구 저장
                                      # 컨테이너를 삭제해도 볼륨이 남아 데이터가 유지됨
                                      # "docker-compose down -v" 실행 시에만 삭제됨
      # 초기 DDL/DML 스크립트를 자동 실행하려면 아래 주석 해제:
      # - ./src/main/resources/db/init:/docker-entrypoint-initdb.d

    healthcheck:
      # MariaDB 공식 헬스체크 스크립트: 소켓 연결 가능 + InnoDB 엔진 초기화 완료 여부 확인
      # 이 체크를 통과해야 app 컨테이너가 시작됨 (depends_on condition: service_healthy)
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s   # 10초마다 체크
      timeout: 5s     # 5초 내 응답 없으면 실패
      retries: 5      # 5번 연속 실패 시 unhealthy → app 컨테이너 시작 차단

    restart: unless-stopped
    networks:
      - app-network


# Named Volume 정의
# Docker가 관리하는 영구 저장소 (경로: /var/lib/docker/volumes/..., Windows는 Docker Desktop 내부)
# 컨테이너와 독립적으로 존재 → 컨테이너 재생성해도 데이터 유지
volumes:
  mariadb-data:

# 사용자 정의 브릿지 네트워크
# 기본 네트워크보다 격리성이 높고, 서비스명으로 DNS 조회 가능
# app → mariadb 통신 시 DB_HOST=mariadb 가 동작하는 원리
networks:
  app-network:
    driver: bridge
