# ============================================================
# docker-compose.yml — 앱만 컨테이너로 띄우고 외부 MariaDB 사용
# ============================================================
# 역할:
#   Spring Boot 앱만 컨테이너로 띄우고, 데이터베이스는 이미 호스트(또는 다른
#   컨테이너) 에 떠 있는 MariaDB 를 참조한다.
#
# 두 가지 시나리오 지원:
#   A) 호스트 PC 에 MariaDB 가 떠있고 포트가 노출돼 있음 (3306 또는 50002)
#      → DB_HOST=host.docker.internal (기본값)  ※ Docker Desktop 자동 동작
#   B) 다른 Docker 컨테이너로 MariaDB 가 떠있고 같은 네트워크 공유
#      → DB_HOST=mariadb (또는 그 컨테이너 이름)  ※ .env 에서 override
#
# 풀스택 (앱 + DB 모두 컨테이너) 가 필요하면 docker-compose.full.yml 사용:
#   docker-compose -f docker-compose.full.yml up -d
#
# 사전 조건:
#   1. .env 파일 준비 (cp .env.example .env 후 값 수정)
#   2. Docker Desktop 실행 중
#   3. 외부 MariaDB 가 호스트의 ${DB_PORT} 포트로 접근 가능하거나
#      .env 의 DB_HOST 를 컨테이너 이름으로 지정
#
# 주요 명령어:
#   docker-compose up -d             앱 기동
#   docker-compose up -d --build     이미지 재빌드 후 기동
#   docker-compose down              앱 종료
#   docker-compose logs -f app       앱 로그
# ============================================================

services:

  # ── Spring Boot 앱 ──────────────────────────────────────────────────────────
  app:
    build: .
    image: sangjinyoo/spring-starter-maven:${TAG:-latest}
    container_name: spring-starter-app

    ports:
      - "8081:8081"

    environment:
      SPRING_PROFILES_ACTIVE: dev

      # ─ DB 접속 정보 ─────────────────────────────────────────────────────────
      # 기본값: host.docker.internal (Docker Desktop이 호스트 PC를 가리키는 특수 DNS)
      # 호스트 MariaDB 가 표준 3306 포트로 떠있다면 그대로 사용.
      # 다른 컨테이너의 mariadb 를 참조하려면 .env 에 다음과 같이:
      #   DB_HOST=mariadb              ← 기존 mariadb 컨테이너 이름
      #   COMPOSE_NETWORK=bridge       ← 기존 mariadb 가 속한 네트워크
      DB_HOST:     ${DB_HOST:-host.docker.internal}
      DB_PORT:     ${DB_PORT:-3306}
      DB_NAME:     ${DB_NAME:-SJSJSS}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}

      JAVA_OPTS: "-Xms256m -Xmx512m"

    # Linux 호환성 — Docker Desktop 외 환경에서도 host.docker.internal 동작 보장
    extra_hosts:
      - "host.docker.internal:host-gateway"

    restart: unless-stopped

    # ─ 네트워크 ─────────────────────────────────────────────────────────────
    # 기본은 격리된 컴포즈 네트워크. 기존 mariadb 컨테이너가 별도 네트워크에
    # 있으면 그 네트워크를 external 로 선언해 합류시킬 수 있다.
    #
    # 예) 기존 mariadb 가 "shared-mariadb-net" 네트워크에 있다면:
    #   1. .env 에  COMPOSE_NETWORK=shared-mariadb-net  추가
    #   2. networks 섹션 아래 external 블록 주석 해제
    #   3. DB_HOST 를 mariadb 컨테이너 이름으로 변경
    networks:
      - app-network


# ── 네트워크 정의 ────────────────────────────────────────────────────────────
networks:
  app-network:
    driver: bridge
    # 외부 네트워크를 참조하려면 위 driver 줄을 지우고 아래 주석 해제:
    # external: true
    # name: ${COMPOSE_NETWORK:-shared-mariadb-net}
