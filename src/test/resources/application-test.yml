# ============================================================
# application-test.yml — 테스트 환경
# H2 인메모리 DB 사용 — Jenkins CI에서 MariaDB 없이 실행
# mybatis, springdoc, autoconfigure 설정은 application.yml 공통에서 상속
# ============================================================
spring:
  datasource:
    url: jdbc:h2:mem:testdb;MODE=MariaDB;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:

logging:
  level:
    root: WARN
    com.example.demo: INFO

server:
  port: 8081
