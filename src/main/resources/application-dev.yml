# ============================================================
# application-dev.yml — 개발 서버 설정
# ============================================================
# 역할:
#   팀 공용 개발 서버(dev 서버)에 배포할 때 사용하는 설정.
#   로컬 환경과 비슷하지만 실제 서버(Docker/원격)에서 실행된다는 차이가 있음.
#
# 활성화 방법:
#   환경변수: SPRING_PROFILES_ACTIVE=dev
#   Docker:  -e SPRING_PROFILES_ACTIVE=dev  또는  docker-compose.yml의 environment
#
# DB 접속 정보:
#   Jenkins Credentials (withCredentials) 또는 서버 환경변수로 주입.
#   로컬(.env)과 달리 기본값이 없음 → 환경변수 미설정 시 기동 실패 (의도적, 보안상 안전)
# ============================================================

spring:
  datasource:
    driver-class-name: org.mariadb.jdbc.Driver
    url: jdbc:mariadb://${DB_HOST}:${DB_PORT:3306}/${DB_NAME}
    # 로컬과 달리 DB_HOST, DB_NAME에 기본값 없음 → 반드시 환경변수로 주입해야 함
    # DB_PORT만 3306 기본값 제공 (표준 MariaDB 포트)
    username: ${DB_USERNAME}  # Jenkins Credentials 또는 서버 환경변수에서 주입
    password: ${DB_PASSWORD}

  thymeleaf:
    cache: false           # 개발 서버에서도 HTML 수정이 바로 반영되도록 캐시 비활성화
    prefix: classpath:/templates/
    suffix: .html


logging:
  level:
    root: INFO            # 개발 서버: INFO 레벨 (로컬처럼 너무 많은 로그는 불필요)
    com.example.demo: DEBUG  # 내 코드는 DEBUG로 상세 출력 (버그 추적에 도움)
  logback:
    rollingpolicy:
      max-file-size: 100MB  # 개발 서버 로그 파일 최대 100MB
      max-history: 7        # 7개 파일 보관


server:
  port: 8081  # dev 서버도 동일 포트 사용 (앞단에 Nginx가 80 → 8081로 프록시하는 구조)
