# ============================================================
# application.yml — Spring Boot 공통 설정
# ============================================================
# 역할:
#   모든 프로파일(local/dev/prod/test)에 공통으로 적용되는 설정.
#   프로파일별 설정은 각각의 파일(application-{profile}.yml)에서 override 가능.
#
# 설정 파일 로딩 순서 (우선순위 높은 순):
#   1. 환경변수       SPRING_PROFILES_ACTIVE=prod
#   2. JVM 인자       -Dspring.profiles.active=prod
#   3. 이 파일의 기본값  active: local
#
# 프로파일별 파일:
#   application-local.yml  로컬 개발 환경 (기본값)
#   application-dev.yml    개발 서버
#   application-prod.yml   운영 서버
#   application-test.yml   테스트 (Jenkins CI)
# ============================================================

spring:
  application:
    name: SpringStarterMavenProject  # 앱 식별자. 로그, actuator/info, 분산 추적에서 앱 이름으로 표시됨

  profiles:
    active: local  # 기본 활성 프로파일 (여기서 설정한 값보다 아래 방법들이 모두 우선함)
                   #
                   # Override 방법 (우선순위 높은 순):
                   #   1. 커맨드라인 인수  : java -jar app.jar --spring.profiles.active=prod
                   #   2. JVM 시스템 프로퍼티: java -Dspring.profiles.active=prod -jar app.jar
                   #                         mvnw.cmd spring-boot:run -Dspring-boot.run.profiles=dev
                   #   3. 환경변수        : SPRING_PROFILES_ACTIVE=prod (K8s ConfigMap, Docker -e)
                   #   4. IDE            : IntelliJ → Run Configuration → "Active profiles" 입력란
                   #                       (환경변수 없이도 프로파일 지정 가능)

  autoconfigure:
    exclude:
      # Spring Session 자동설정 제외
      # Redis 기반 세션 관리 기능인데 아직 구현하지 않아 비활성화
      # 활성화하면 기동 시 "Redis 연결 필요" 오류 발생
      - org.springframework.boot.autoconfigure.session.SessionAutoConfiguration

  # ── JPA / Hibernate 공통 설정 ──────────────────────────────────────────────
  # 운영 안전 기본값. 프로파일에서 필요한 경우에만 override (local: show-sql=true, test: H2 방언)
  jpa:
    hibernate:
      ddl-auto: validate     # 엔티티-DB 스키마 일치 여부만 검증. 자동 변경 금지
    show-sql: false          # SQL 로그는 로컬에서만 켜기
    open-in-view: false      # OSIV 끄기 — Lazy 로딩 사고를 컴파일 단계에서 노출
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MariaDBDialect


# ── MyBatis 설정 ─────────────────────────────────────────────────────────────
mybatis:
  mapper-locations: classpath:/mybatis/mapper/**/*.xml
  # SQL이 작성된 XML 파일 위치. ** = 하위 모든 디렉터리, *.xml = 모든 XML 파일
  # classpath: = src/main/resources/ 디렉터리 기준
  #
  # ⚠ static/ 하위에 두면 안 됨 — Spring Boot가 정적 리소스로 외부에 그대로 서빙되어
  #   SQL 쿼리와 DB 스키마가 노출됨. 반드시 static/ 바깥에 위치해야 함.

  type-aliases-package: com.example.demo.domain, com.example.demo.application
  # 이 패키지 하위 클래스는 XML에서 전체 경로 없이 클래스 이름만으로 참조 가능
  # 예: com.example.demo.domain.member.entity.Member → Member 로 축약
  #
  # ⚠ com.example.demo 루트로 잡으면 안 됨 — interfaces 패키지의 동일 이름 클래스
  #   (예: v1/v2 의 MemberApiController) 가 별칭 충돌을 일으킴.
  #   domain + application 만 스캔하면 충분 (Entity, DTO 가 여기 있음).

  configuration:
    map-underscore-to-camel-case: true
    # DB 컬럼명(snake_case)을 자바 필드명(camelCase)으로 자동 변환
    # 예: created_at (DB) → createdAt (Java)

    jdbc-type-for-null: NULL
    # null 값을 DB에 보낼 때 사용할 JDBC 타입. NULL로 지정하면 MyBatis가 자동 처리

    call-setters-on-nulls: true
    # 쿼리 결과에 null 값이 있어도 setter를 호출해 필드에 null을 명시적으로 설정
    # false이면 null 컬럼은 setter가 호출되지 않아 이전 값이 남을 수 있음


# ── Swagger UI 설정 (springdoc-openapi) ──────────────────────────────────────
springdoc:
  swagger-ui:
    path: /swagger-ui.html        # Swagger UI 접속 경로 (기본값: /swagger-ui/index.html)
    groups-order: DESC            # API 그룹 정렬 순서 (DESC: 내림차순)
    tags-sorter: alpha            # 태그(@Tag)를 알파벳 순으로 정렬
    operations-sorter: alpha      # 각 태그 내 API를 알파벳 순으로 정렬
  api-docs:
    path: /api-docs               # OpenAPI JSON 스펙 파일 경로 (기본값: /v3/api-docs)
                                  # Postman import 또는 자동 문서 생성 도구에서 이 URL 사용
