# ============================================================
# application.yml (공통 설정)
# ============================================================
spring:
  profiles:
    active: local

mybatis:
  mapper-locations: classpath:/static/mybatis/mapper/**/*.xml
  type-aliases-package: com.example.demo
  configuration:
    map-underscore-to-camel-case: true
    jdbc-type-for-null: NULL
    call-setters-on-nulls: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    groups-order: DESC
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /api-docs

---
# ============================================================
# application-local.yml (로컬 개발 환경)
# ============================================================
spring:
  config:
    activate:
      on-profile: local
  application:
    name: SpringStarterMavenProject
  thymeleaf:
    cache: false
    prefix: classpath:/templates/
    suffix: .html
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.session.SessionAutoConfiguration
  datasource:
    driver-class-name: org.mariadb.jdbc.Driver
    url: jdbc:mariadb://${DB_HOST:localhost}:${DB_PORT:50002}/${DB_NAME:SJSJSS}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:admin}
  devtools:
    restart:
      enabled: true
    livereload:
      enabled: true

# 로컬에서만 SQL 쿼리 콘솔 출력
mybatis:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

logging:
  level:
    root: INFO
    com.example.demo: DEBUG
    org.springframework.web: DEBUG
  logback:
    rollingpolicy:
      max-file-size: 100MB
      max-history: 7

server:
  port: 8081

---
# ============================================================
# application-dev.yml (개발 서버)
# ============================================================
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    driver-class-name: org.mariadb.jdbc.Driver
    url: jdbc:mariadb://${DB_HOST}:${DB_PORT:3306}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

logging:
  level:
    root: INFO
    com.example.demo: DEBUG

server:
  port: 8081

---
# ============================================================
# application-prod.yml (운영 서버)
# ============================================================
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    driver-class-name: org.mariadb.jdbc.Driver
    url: jdbc:mariadb://${DB_HOST}:${DB_PORT:3306}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

logging:
  level:
    root: ERROR
    com.example.demo: INFO
  file:
    name: /var/log/application.log
  logback:
    rollingpolicy:
      max-file-size: 500MB
      max-history: 30
      total-size-cap: 5GB

server:
  port: 80
  tomcat:
    threads:
      max: 200
      min-spare: 10
    max-connections: 8192
    accept-count: 100

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized
