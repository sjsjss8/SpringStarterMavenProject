# ============================================================
# application.yml — 공통 설정 (모든 프로파일에 적용)
#
# 프로파일 활성화 방법 (우선순위 높은 순):
#   1. 환경변수      : SPRING_PROFILES_ACTIVE=prod
#   2. JVM 인자      : -Dspring.profiles.active=dev
#   3. 아래 기본값   : local (개발 PC 전용)
# ============================================================
spring:
  application:
    name: SpringStarterMavenProject
  profiles:
    active: local   # 로컬 기본값 — 서버 배포 시 반드시 환경변수로 override
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.session.SessionAutoConfiguration

mybatis:
  mapper-locations: classpath:/static/mybatis/mapper/**/*.xml
  type-aliases-package: com.example.demo
  configuration:
    map-underscore-to-camel-case: true
    jdbc-type-for-null: NULL
    call-setters-on-nulls: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    groups-order: DESC
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /api-docs
