# ============================================================
# k8s/secret.yaml — Kubernetes Secret (민감 인증 정보)
# ============================================================
# 역할:
#   DB 비밀번호처럼 외부에 노출되면 안 되는 민감한 정보를 저장.
#   파드에 환경변수로 주입되어 애플리케이션이 사용.
#
# Secret vs ConfigMap:
#   Secret    : 비밀번호, 계정명, API 키 등 인증/인가에 사용되는 민감 정보
#   ConfigMap : DB 주소, 포트, 프로파일 등 공개 설정 (configmap.yaml 참고)
#
# stringData vs data:
#   stringData: 평문으로 작성 가능. K8s가 저장 시 자동으로 Base64 인코딩
#   data      : Base64로 직접 인코딩해서 작성해야 함 (echo -n "값" | base64)
#   → 이 파일은 stringData 사용 (작성 편의)
#
# ⚠ 보안 주의사항:
#   이 파일을 실제 비밀번호 그대로 Git에 커밋하지 마세요!
#   운영 환경 권장 대안:
#     1. Sealed Secrets   : kubeseal로 암호화 후 Git 커밋 가능
#     2. External Secrets : AWS Secrets Manager / HashiCorp Vault 연동
#     3. kubectl 직접 생성: kubectl create secret generic spring-app-secret \
#                            --from-literal=DB_USERNAME=xxx \
#                            --from-literal=DB_PASSWORD=xxx
#
# 적용 명령어:
#   kubectl apply -f k8s/secret.yaml
#   kubectl get secret spring-app-secret  # 저장 여부 확인 (값은 Base64로 숨겨짐)
# ============================================================

apiVersion: v1
kind: Secret

metadata:
  name: spring-app-secret   # deployment.yaml의 secretKeyRef.name과 일치해야 함
  namespace: default

type: Opaque  # 일반 비밀정보 타입. kubernetes.io/tls(인증서), kubernetes.io/dockerconfigjson(레지스트리 인증) 등도 있음

stringData:
  # deployment.yaml의 env.valueFrom.secretKeyRef.key 와 대응됨
  DB_USERNAME:      "your-db-user"        # ← 운영 DB 계정으로 변경 (root는 권장하지 않음)
  DB_PASSWORD:      "your-db-password"    # ← 운영 DB 비밀번호로 변경
  DB_ROOT_PASSWORD: "your-root-password"  # ← MariaDB root 비밀번호 (초기화 스크립트용)
                                          #   앱 접속 계정(DB_USERNAME)과 반드시 다른 값 사용 권장
