# ============================================================
# k8s/service.yaml — Kubernetes Service 설정
# ============================================================
# 역할:
#   클러스터 외부에서 Spring Boot 파드로 트래픽을 전달하는 네트워크 진입점.
#   파드의 IP는 재시작마다 바뀌지만, Service IP는 고정 → 안정적인 접속 가능.
#   여러 파드가 실행 중이면 자동으로 로드밸런싱(라운드로빈)함.
#
# 적용 명령어:
#   kubectl apply -f k8s/service.yaml
#   kubectl get service spring-starter-maven   # 외부 IP 확인
# ============================================================

apiVersion: v1     # Service는 core API 그룹 (v1)
kind: Service      # 리소스 종류: Service = 파드로 가는 네트워크 추상화 레이어

metadata:
  name: spring-starter-maven   # Service 이름
  namespace: default
  labels:
    app: spring-starter-maven

spec:
  selector:
    app: spring-starter-maven  # 이 레이블을 가진 파드에게만 트래픽을 전달
                                # deployment.yaml의 template.metadata.labels와 일치해야 함

  ports:
    - name: http
      protocol: TCP
      port: 80          # Service가 외부에 노출하는 포트 (클라이언트가 접속하는 포트)
      targetPort: 8081  # 실제 컨테이너 내부 포트 (앱이 8081에서 수신 대기)
                        # 외부 80 → 컨테이너 8081 으로 포트 변환

  type: LoadBalancer
  # Service 종류:
  #   ClusterIP   : 클러스터 내부에서만 접근 가능 (기본값)
  #   NodePort    : 각 노드의 고정 포트로 외부 접근 가능 (온프레미스/minikube)
  #   LoadBalancer: 클라우드 제공자(AWS ELB, GCP LB, Azure LB)가 외부 IP를 자동 발급
  #                 → 가장 편리하지만 클라우드 환경에서만 작동
  #                 → 로컬 minikube에서는 "minikube tunnel" 명령으로 시뮬레이션 가능
