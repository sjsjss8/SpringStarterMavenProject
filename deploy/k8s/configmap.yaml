# ============================================================
# k8s/configmap.yaml — Kubernetes ConfigMap (비민감 설정)
# ============================================================
# 역할:
#   파드에 주입할 환경변수 중 "비밀번호가 아닌 일반 설정값"을 저장.
#   Secret(secret.yaml)과 역할 분담:
#     ConfigMap : DB 주소, 포트, DB 이름, 프로파일 등 공개해도 되는 설정
#     Secret    : DB 비밀번호, 계정명 등 민감한 인증 정보
#
# ConfigMap vs Secret 구분 기준:
#   "이 값이 노출되면 보안 사고가 발생하는가?"
#     YES → Secret  /  NO → ConfigMap
#
# 적용 명령어:
#   kubectl apply -f k8s/configmap.yaml
#   kubectl get configmap spring-app-config -o yaml   # 현재 값 확인
#
# ⚠ 실제 운영 배포 전 DB_HOST를 실제 운영 DB 주소로 변경하세요.
# ============================================================

apiVersion: v1
kind: ConfigMap

metadata:
  name: spring-app-config   # deployment.yaml의 configMapKeyRef.name과 일치해야 함
  namespace: default

data:
  # deployment.yaml의 env.valueFrom.configMapKeyRef.key 와 대응됨
  SPRING_PROFILES_ACTIVE: "prod"              # Spring 프로파일: 운영 환경이므로 prod
  DB_HOST:                "your-db-host"      # ← 운영 DB 서버 주소로 변경 (예: db.mycompany.com)
  DB_PORT:                "3306"              # MariaDB 기본 포트
  DB_NAME:                "SJSJSS"            # 데이터베이스 이름
