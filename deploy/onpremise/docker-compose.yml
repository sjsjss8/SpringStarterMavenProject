  #     MARIADB_DATABASE: SJSJSS                     # ★ DB 이름
  #     MARIADB_USER: your_db_user                   # ★ 앱 접속 계정
  #     MARIADB_PASSWORD: your_db_password           # ★ 앱 접속 비밀번호
