# ============================================================
# onpremise/docker-compose.yml — 고객사 Docker 배포용 컴포즈 파일
# ============================================================
# 역할:
#   고객사 서버에 Docker 방식으로 설치할 때 사용하는 docker-compose 파일.
#   이 파일은 배포 패키지(ZIP)에 포함되어 고객사에 전달됨.
#
# 배포 패키지 구조 (onpremise-docker 선택 시 생성):
#   spring-starter-maven-{버전}-docker-release.zip
#   ├── image.tar.gz          ← Docker 이미지 파일 (인터넷 없이 설치 가능)
#   ├── docker-compose.yml    ← 이 파일
#   ├── INSTALL.md            ← 설치 가이드
#   └── load-and-run.sh       ← 이미지 로드 + 컨테이너 실행 원클릭 스크립트
#
# 사용 방법:
#   1. 이미지 로드:  docker load < image.tar.gz
#   2. 설정 수정:    docker-compose.yml의 환경변수(DB_HOST 등) 편집
#   3. 컨테이너 실행: docker-compose up -d
#   또는 load-and-run.sh 를 실행하면 1~3 자동 처리
#
# 사전 조건:
#   - Docker Engine 20.10 이상 설치
#   - docker-compose v2 이상 설치
#   - MariaDB 또는 MySQL 서버 (별도 구성 또는 아래 db 서비스 활성화)
# ============================================================

services:

  # ── 애플리케이션 컨테이너 ────────────────────────────────────────────────────
  app:
    # image.tar.gz 로드 후 생성된 이미지 이름. load-and-run.sh 실행 시 자동 설정됨.
    # 수동으로 'docker load' 했다면 실제 이미지 이름으로 변경:
    #   예: image: your-company/spring-starter-maven:1.0.0
    image: spring-starter-maven:latest

    container_name: spring-app

    ports:
      - "8080:8080"    # ★ 호스트포트:컨테이너포트. 8080이 이미 사용 중이면 왼쪽 포트 변경
                       # 예: "9090:8080" → 외부에서 9090으로 접속

    environment:
      # ★ 아래 DB 접속 정보를 고객사 환경에 맞게 수정하세요
      SPRING_PROFILES_ACTIVE: prod

      DB_HOST: host.docker.internal   # ★ DB 서버 주소
                                       # host.docker.internal = 이 컨테이너가 실행되는 호스트 PC
                                       # DB가 다른 서버에 있으면: 해당 서버 IP 입력
                                       # DB가 아래 db 서비스를 사용하면: mariadb 입력
      DB_PORT: "3306"                  # MariaDB 포트 (기본값 유지)
      DB_NAME: SJSJSS                  # ★ DB 이름 (스키마 이름)
      DB_USERNAME: your_db_user        # ★ DB 계정명
      DB_PASSWORD: your_db_password    # ★ DB 비밀번호

    volumes:
      # 컨테이너 외부에 로그 파일을 저장 (컨테이너 재시작 후에도 로그 유지)
      - ./logs:/var/log
      # SQL 매퍼 파일을 외부에서 교체 가능하게 마운트 (수정 후 재시작 시 반영)
      # - ./mapper:/app/mapper    # 활성화하려면 주석 해제

    restart: unless-stopped    # 컨테이너 비정상 종료 시 자동 재시작
                                # Docker 재시작 시에도 자동 시작
                                # stop 명령으로 명시적 중지 시에는 재시작 안 함

    healthcheck:
      # Spring Boot Actuator 헬스 엔드포인트로 앱 정상 동작 여부 확인
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/actuator/health"]
      interval: 30s       # 30초마다 체크
      timeout: 10s        # 10초 내 응답 없으면 실패
      start_period: 60s   # 시작 후 60초는 헬스체크 결과 무시 (앱 기동 시간)
      retries: 3          # 3번 연속 실패 시 unhealthy 상태로 전환

    # ── DB 서비스를 함께 띄울 경우 아래 주석 해제 ──────────────────────────
    # depends_on:
    #   db:
    #     condition: service_healthy

  # ── MariaDB 컨테이너 (선택) ───────────────────────────────────────────────
  # 고객사 서버에 MariaDB를 별도로 설치하지 않고 Docker로 함께 실행할 때 활성화.
  # 주석 해제 후 환경변수를 실제 값으로 변경하고 app 서비스의 DB_HOST: mariadb 로 수정.
