# ============================================================
# docker-compose.prod.yml — 운영 서버 배포용
# ============================================================
# 역할:
#   Jenkins CI/CD 파이프라인의 "dockerhub-compose" 배포 방식에서 사용.
#   Jenkins가 이 파일을 원격 서버로 전송(SCP)한 뒤,
#   원격 서버에서 docker-compose pull + up 을 실행해 배포함.
#
# docker-compose.yml(로컬)과의 주요 차이:
#   - build: . 없음 → Docker Hub에서 이미 빌드된 이미지를 pull해서 사용
#   - SPRING_PROFILES_ACTIVE=prod → application-prod.yml 설정 적용
#   - 앱 헬스체크 추가 (운영 서버 안정성 확보)
#   - 이미지 이름이 ${DOCKER_IMAGE}:${DOCKER_TAG} 변수 → Jenkins가 주입
#
# 배포 흐름 (Jenkinsfile의 dockerhub-compose 방식):
#   1. Jenkins: 소스 빌드 → Docker 이미지 생성 → Docker Hub에 Push
#   2. Jenkins: 이 파일을 원격 서버로 SCP 전송
#   3. 원격 서버: docker-compose pull  (Docker Hub에서 최신 이미지 다운로드)
#   4. 원격 서버: docker-compose up -d (컨테이너 재시작)
#
# 환경변수 주입 방법:
#   - 원격 서버에 .env 파일을 미리 생성해두거나
#   - Jenkins 파이프라인에서 SSH로 환경변수를 주입
# ============================================================

services:

  # ── Spring Boot 앱 ──────────────────────────────────────────────────────────
  app:
    image: ${DOCKER_IMAGE}:${DOCKER_TAG:-latest}
    # ${DOCKER_IMAGE}: Jenkins에서 주입 (예: myid/spring-starter-maven)
    # ${DOCKER_TAG}  : Jenkins 빌드 번호 태그 (예: build-42). 없으면 latest

    container_name: spring-starter-app   # 프로젝트 prefix 로 충돌 회피
    restart: unless-stopped  # 서버 재부팅 또는 비정상 종료 후 자동 재시작

    ports:
      - "8081:8081"  # 운영 서버의 8081 포트를 외부에 노출
                     # 앞단에 Nginx 등 리버스 프록시가 있으면 80/443 → 8081로 프록시함

    environment:
      SPRING_PROFILES_ACTIVE: prod  # 운영 프로파일 → application-prod.yml 설정 적용
                                    # 로그 레벨 ERROR, 포트 80, actuator 제한 노출 등
      DB_HOST:     ${DB_HOST:-mariadb}   # 기본값 mariadb (같은 Compose 네트워크 내 DB 서비스)
                                         # 외부 DB(RDS 등) 사용 시 해당 호스트 주소로 변경
      DB_PORT:     ${DB_PORT:-50002}
      DB_NAME:     ${DB_NAME:-SJSJSS}
      DB_USERNAME: ${DB_USERNAME}        # 원격 서버 .env 파일에서 주입
      DB_PASSWORD: ${DB_PASSWORD}        # 원격 서버 .env 파일에서 주입
      JAVA_OPTS:   "-Xms256m -Xmx512m"  # 운영 서버 메모리에 맞게 조정 필요

    depends_on:
      mariadb:
        condition: service_healthy  # MariaDB 준비 완료 후에만 앱 시작

    healthcheck:
      # 운영 서버에서 앱 자체 상태 모니터링
      # curl -sf: 조용히(-s) 실행, HTTP 오류 코드 시 실패(-f)
      test: ["CMD-SHELL", "curl -sf http://localhost:8081/actuator/health || exit 1"]
      interval: 30s       # 운영: 30초마다 체크 (개발보다 여유 있게)
      timeout: 10s        # 10초 내 응답 없으면 실패
      retries: 3          # 3번 연속 실패 시 unhealthy
      start_period: 60s   # 앱 기동 시간(최초 60초) 동안은 실패 카운트 안 함

    networks:
      - app-network


  # ── MariaDB ─────────────────────────────────────────────────────────────────
  mariadb:
    image: mariadb:10.11
    container_name: spring-starter-mariadb   # 프로젝트 prefix 로 충돌 회피 (서비스명 mariadb 는 유지)
    restart: unless-stopped

    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}    # root 비밀번호 (앱 접속 계정과 별도 관리)
      MARIADB_DATABASE:      ${DB_NAME:-SJSJSS}
      MARIADB_USER:          ${DB_USERNAME}
      MARIADB_PASSWORD:      ${DB_PASSWORD}

    volumes:
      - mariadb-data:/var/lib/mysql  # 운영 데이터 영구 보존
                                      # ⚠ "docker-compose down -v" 절대 금지 (데이터 삭제됨)

    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - app-network


volumes:
  mariadb-data:  # 운영 DB 데이터 영구 저장 볼륨

networks:
  app-network:
    driver: bridge
