# ── 비민감 앱 설정 (ConfigMap) ──────────────────────────────────────────────
# 민감 정보(비밀번호·계정)는 secret.yaml 에 보관
apiVersion: v1
kind: ConfigMap
metadata:
  name: spring-app-config
  namespace: default
data:
  SPRING_PROFILES_ACTIVE: "prod"
  DB_HOST:                 "your-db-host"   # ← 운영 DB 호스트로 변경
  DB_PORT:                 "3306"
  DB_NAME:                 "SJSJSS"
