# ── DB 접속 정보 Secret ────────────────────────────────────────────────────────
# ⚠ 실제 배포 전 아래 값을 운영 서버 정보로 반드시 교체하세요.
#
# 보안 강화 방법 (운영 환경 권장):
#   - Sealed Secrets : kubeseal 로 암호화 후 Git에 커밋
#   - External Secrets Operator : AWS Secrets Manager / Vault 연동
#   - kubectl create secret (직접 CLI 생성, Git에는 커밋 X)
#
# stringData를 사용하면 Base64 인코딩 없이 평문으로 작성 가능
# (K8s가 저장 시 자동으로 Base64 인코딩)
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: v1
kind: Secret
metadata:
  name: spring-app-secret
  namespace: default
type: Opaque
stringData:
  DB_HOST:     "your-db-host"    # ← 운영 DB 호스트로 변경
  DB_PORT:     "3306"
  DB_NAME:     "SJSJSS"
  DB_USERNAME: "root"            # ← 운영 DB 계정으로 변경
  DB_PASSWORD: "your-password"   # ← 운영 DB 비밀번호로 변경
