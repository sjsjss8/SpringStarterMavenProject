# ── DB 접속 인증 정보 Secret ─────────────────────────────────────────────────
# ⚠ 실제 배포 전 아래 값을 운영 서버 정보로 반드시 교체하세요.
#
# 보안 강화 방법 (운영 환경 권장):
#   - Sealed Secrets : kubeseal 로 암호화 후 Git에 커밋
#   - External Secrets Operator : AWS Secrets Manager / Vault 연동
#   - kubectl create secret (직접 CLI 생성, Git에는 커밋 X)
#
# DB_HOST / DB_PORT / DB_NAME 같은 비민감 설정은 configmap.yaml 에서 관리
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: v1
kind: Secret
metadata:
  name: spring-app-secret
  namespace: default
type: Opaque
stringData:
  DB_USERNAME:      "your-db-user"        # ← 운영 DB 계정으로 변경
  DB_PASSWORD:      "your-db-password"    # ← 운영 DB 비밀번호로 변경
  DB_ROOT_PASSWORD: "your-root-password"  # ← MariaDB root 비밀번호 (초기화 스크립트용)
