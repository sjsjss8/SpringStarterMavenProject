apiVersion: apps/v1
kind: Deployment
metadata:
  name: spring-starter-maven
  namespace: default
  labels:
    app: spring-starter-maven
spec:
  replicas: 2                       # 파드 2개 → 한 개 재시작 중에도 무중단
  selector:
    matchLabels:
      app: spring-starter-maven
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1                   # 배포 중 최대 1개 초과 실행 허용
      maxUnavailable: 0             # 배포 중 중단 파드 0개 → 완전 무중단
  template:
    metadata:
      labels:
        app: spring-starter-maven
    spec:
      terminationGracePeriodSeconds: 60   # SIGTERM 후 최대 60s 대기 (처리 중 요청 마무리)
      containers:
        - name: spring-starter-maven
          image: IMAGE_PLACEHOLDER         # Jenkins가 빌드 번호 태그로 자동 치환
          imagePullPolicy: Always          # 같은 태그라도 항상 최신 이미지 Pull
          ports:
            - containerPort: 8081
          env:
            # ── 비민감 설정 (ConfigMap) ───────────────────────────────────────
            - name: SPRING_PROFILES_ACTIVE
              valueFrom:
                configMapKeyRef:
                  name: spring-app-config
                  key: SPRING_PROFILES_ACTIVE
            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: spring-app-config
                  key: DB_HOST
            - name: DB_PORT
              valueFrom:
                configMapKeyRef:
                  name: spring-app-config
                  key: DB_PORT
            - name: DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: spring-app-config
                  key: DB_NAME
            # ── 민감 정보 (Secret) ───────────────────────────────────────────
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: spring-app-secret
                  key: DB_USERNAME
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: spring-app-secret
                  key: DB_PASSWORD
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "500m"
          # readinessProbe: 트래픽 수신 준비 완료 여부 (실패 시 로드밸런서에서 제외)
          # → /readiness : Spring Boot가 관리하는 ReadinessState (DB 연결 등 확인)
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8081
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3
          # livenessProbe: 파드 생존 여부 (실패 시 컨테이너 자동 재시작)
          # → /liveness : 앱 자체가 정상 동작 중인지 (교착상태 등 감지)
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8081
            initialDelaySeconds: 60
            periodSeconds: 30
            failureThreshold: 3
